[package]
name = "ydotool-win"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ydotool"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Media",
  "Win32_System_Console",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
